# Lives in the PUBLIC repo codeman9528/My-Xboard-build (free Actions minutes).
# Pulls the PRIVATE source repo with a read-only deploy key, builds a multi-arch
# image and pushes it to ghcr.io/codeman9528/my-xboard.
name: docker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/sha of codeman9528/My-Xboard to build"
        default: master
  repository_dispatch:
    types: [source-updated]
  schedule:
    - cron: "*/10 * * * *"   # poll private master; build only if its sha has no image yet

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: codeman9528/My-Xboard
          ref: ${{ inputs.ref || 'master' }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: chk
        run: |
          SHA=$(git rev-parse --short=7 HEAD); echo "sha=$SHA" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = schedule ] && docker buildx imagetools inspect ghcr.io/codeman9528/my-xboard:$SHA >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      # Admin frontend: built from the private source repo (codeman9528/My-Xboard-admin)
      # into public/assets/admin/ of the build context. Only the compiled output
      # enters the image; admin-src itself is excluded by .dockerignore.
      - if: steps.chk.outputs.skip != 'true'
        name: Checkout admin frontend source
        uses: actions/checkout@v4
        with:
          repository: codeman9528/My-Xboard-admin
          ssh-key: ${{ secrets.ADMIN_DEPLOY_KEY }}
          path: admin-src
          persist-credentials: false

      - if: steps.chk.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-src/package-lock.json

      - if: steps.chk.outputs.skip != 'true'
        name: Build admin frontend
        run: |
          cd admin-src
          npm ci --no-audit --no-fund
          XBOARD_PUBLIC_ASSETS_DIR="$GITHUB_WORKSPACE/public/assets/admin" npm run build
          test -f "$GITHUB_WORKSPACE/public/assets/admin/manifest.json"
          ls "$GITHUB_WORKSPACE/public/assets/admin/locales"

      - if: steps.chk.outputs.skip != 'true'
        name: Stamp version
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php

      - if: steps.chk.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.chk.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.chk.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codeman9528/my-xboard
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.chk.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The private .git is baked into the image (the app reads it for its
      # version); deploy-key checkout stores no secret in .git/config.
      - if: steps.chk.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
