# Lives in the PUBLIC repo codeman9528/Xboard-build (free Actions minutes).
# Pulls the PRIVATE source repo with a read-only deploy key, builds a multi-arch
# image and pushes it to ghcr.io/codeman9528/xboard.
name: docker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/sha of codeman9528/Xboard to build"
        default: master
  repository_dispatch:
    types: [source-updated]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: codeman9528/Xboard
          ref: ${{ inputs.ref || 'master' }}
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      # Submodule (admin frontend) is a public repo; fetch it over https, no key.
      - name: Init submodules
        run: git submodule update --init --recursive --force

      - name: Stamp version
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codeman9528/xboard
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The private .git is baked into the image (the app reads it for its
      # version); deploy-key checkout stores no secret in .git/config.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
